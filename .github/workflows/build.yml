name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: swiftc -O app/Sources/*.swift -o GPUMonitor
      - name: Render icon
        run: ./GPUMonitor --icon icon.png && test -s icon.png
      - name: Check backend
        run: python3 -m py_compile backend/gpumon.py
